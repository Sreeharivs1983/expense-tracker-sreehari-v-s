<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Expense Tracker</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="app-container">
      <header class="app-header">
        <h1>Expense Tracker</h1>
        <p>Manage your income and expenses easily</p>
      </header>

      <section class="summary-container">
        <div class="summary-card income-card">
          <h3>Total Income</h3>
          <p id="total-income">₹0.00</p>
        </div>

        <div class="summary-card expense-card">
          <h3>Total Expenses</h3>
          <p id="total-expenses">₹0.00</p>
        </div>

        <div class="summary-card balance-card">
          <h3>Current Balance</h3>
          <p id="current-balance">₹0.00</p>
        </div>
      </section>

      <section class="form-section">
        <h2>Add Transaction</h2>

        <form id="transaction-form" novalidate>
          <div class="form-group">
            <label for="transaction-type">Type</label>

            <select id="transaction-type" required>
              <option value="">Select Type</option>
              <option value="income">Income</option>
              <option value="expense">Expense</option>
            </select>
          </div>

          <div class="form-group">
            <label for="amount">Amount</label>

            <input
              type="number"
              id="amount"
              placeholder="Enter amount"
              min="0"
              step="0.01"
              required
            />
          </div>

          <div class="form-group">
            <label for="category">Category</label>

            <select id="category" required>
              <option value="">Select Category</option>
              <option value="Salary">Salary</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Shopping">Shopping</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Healthcare">Healthcare</option>
              <option value="Education">Education</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="form-group">
            <label for="date">Date</label>

            <input type="date" id="date" required />
          </div>

          <div class="form-group full-width">
            <label for="description">Description</label>

            <input
              type="text"
              id="description"
              placeholder="Enter description"
              maxlength="100"
              required
            />
          </div>

          <p id="error-message" class="error-message"></p>

          <button type="submit" id="submit-button">Add Transaction</button>
        </form>
      </section>

      <section class="transactions-section">
        <div class="transactions-header">
          <h2>Transactions</h2>

          <div class="filters">
            <select id="type-filter">
              <option value="all">All Types</option>
              <option value="income">Income</option>
              <option value="expense">Expense</option>
            </select>

            <select id="category-filter">
              <option value="all">All Categories</option>
              <option value="Salary">Salary</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Shopping">Shopping</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Healthcare">Healthcare</option>
              <option value="Education">Education</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <div id="transaction-list" class="transaction-list">
          <p id="empty-message" class="empty-message">No transactions found.</p>
        </div>
      </section>

      <section class="monthly-summary">
        <h2>Monthly Summary</h2>

        <div id="monthly-summary-content">
          <p>No transactions recorded for this month.</p>
        </div>
      </section>

      <section class="chart-section">
        <h2>Expense by Category</h2>

        <div id="expense-chart" class="expense-chart">
          <p class="chart-empty-message">No expense data available.</p>
        </div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
